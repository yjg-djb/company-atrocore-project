<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /var/www/localhost/public

  <Directory /var/www/localhost/public/>
    AllowOverride All
    Require all granted
  </Directory>

  ErrorLog "|/usr/bin/rotatelogs /var/log/apache2/localhost-error_%Y.%m.%d.log 5M"
  CustomLog "|/usr/bin/rotatelogs /var/log/apache2/localhost-access_%Y.%m.%d.log 5M" combined
</VirtualHost>
